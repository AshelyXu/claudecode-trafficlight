<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orbFill" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0A8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00F0A8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0A8" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="highlight" cx="30%" cy="28%">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#05070D"/>
  <!-- Ambient glow -->
  <circle cx="256" cy="230" r="80" fill="#00F0A8" opacity="0.10" filter="url(#glow)"/>
  <!-- Orb base -->
  <circle cx="256" cy="230" r="64" fill="url(#orbFill)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Highlight -->
  <circle cx="256" cy="230" r="64" fill="url(#highlight)"/>
  <!-- Pulse ring -->
  <circle cx="256" cy="230" r="74" fill="none" stroke="#00F0A8" stroke-width="2" opacity="0.3"/>
</svg>
